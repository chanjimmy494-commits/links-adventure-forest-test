<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Link's Adventure — Forest Prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #17181d; color: #ddd; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #hud { position: fixed; left: 10px; top: 8px; background: #000a; padding: 6px 10px; border-radius: 4px; white-space: pre; pointer-events:none; max-width:calc(100vw - 20px); }
  #touchpad { display:none; position:fixed; left:max(14px,env(safe-area-inset-left)); bottom:max(18px,env(safe-area-inset-bottom)); width:174px; height:174px; z-index:10; touch-action:none; user-select:none; -webkit-user-select:none; }
  #touchpad .disc {position:absolute;inset:5px;border-radius:50%;background:rgba(20,24,31,.52);border:2px solid rgba(255,255,255,.36);box-shadow:0 2px 15px #0007;}
  #touchpad .cross {position:absolute;left:50%;top:50%;width:104px;height:104px;transform:translate(-50%,-50%);background:rgba(255,255,255,.14);clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%);}
  #touchpad .thumb {position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(225,231,238,.27);border:2px solid rgba(255,255,255,.56);pointer-events:none;}
  #touchpad .arrow {position:absolute;color:#fff9;font-size:25px;font-weight:bold;pointer-events:none;}
  #touchpad .up {left:78px;top:13px} #touchpad .down {left:78px;bottom:10px} #touchpad .left {left:15px;top:69px} #touchpad .right {right:14px;top:69px}
  @media (pointer:coarse) {#touchpad{display:block} #hud{font-size:11px;white-space:pre-wrap;}}
  @media (pointer:coarse) and (orientation:portrait) {#touchpad{left:50%;transform:translateX(-50%);bottom:max(22px,env(safe-area-inset-bottom));} }

#attack{display:none;position:fixed;right:20px;bottom:45px;width:86px;height:86px;border-radius:50%;border:2px solid #e3e9f0a8;background:#262d39b9;color:white;font:bold 15px system-ui;touch-action:none;z-index:11}
@media(pointer:coarse){#attack{display:block}}
@media(pointer:coarse) and (orientation:portrait){#touchpad{left:12px;transform:none;width:174px;height:174px}#attack{right:18px}}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">Loading forest map and artwork…</div>
<div id="touchpad" aria-label="Touch movement control"><div class="disc"></div><div class="cross"></div><span class="arrow up">▲</span><span class="arrow down">▼</span><span class="arrow left">◀</span><span class="arrow right">▶</span><div class="thumb"></div></div>
<button id="attack" type="button">SWORD</button>
<script src="../../../asset-paths.js"></script>
<script src="forest-map-runtime.js"></script>
<script>
'use strict';
// A whole world from the tool's "Export world (.zip)", unzipped next to this page as sample/ (world.json + cells/<A1>/map.json).
// The kit folder (tiles/, overlays/, objects/) is two levels up: this page lives in ForestMapKit/examples/html/.
// Serve the kit folder over http (python -m http.server, VS Code Live Server, ...): browsers do not fetch json from file://.
const WORLD = 'sample/world.json', KIT = '../../';
const kit = ForestMapKit;
const view = document.getElementById('view'), ctx = view.getContext('2d'), hud = document.getElementById('hud');
const ZOOM = matchMedia('(pointer:coarse)').matches ? 0.7 : 0.8;
window.addEventListener('error',e=>{hud.textContent='Game error: '+e.message;});
window.addEventListener('unhandledrejection',e=>{hud.textContent='Loading error: '+String(e.reason?.message||e.reason);});                              // 1 = native pixels (a person is 63 px tall); try 0.5 to see more of the map
const keys = new Set();
addEventListener('keydown', e => { keys.add(e.key.length === 1 ? e.key.toLowerCase() : e.key); if (e.key === 'c') showCol = !showCol; if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
let showCol = false;
let attackTime=0,attackCooldown=0;
function swingSword(){if(attackCooldown>0)return;attackTime=.32;attackCooldown=.40;}
addEventListener('keydown',e=>{if((e.code==='Space'||e.key.toLowerCase()==='j')&&!e.repeat){e.preventDefault();swingSword();}});
document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();swingSword();});
function drawSword(c,a){
 if(attackTime<=0)return;
 const progress=1-attackTime/.32,smoothed=progress*progress*(3-2*progress),angle=a.face-1.5+smoothed*2.6;
 const x=a.x+Math.cos(a.face)*16+Math.cos(angle)*10,y=a.y-33+Math.sin(a.face)*9+Math.sin(angle)*7;
 const reach=38+16*Math.sin(Math.PI*progress),tx=x+Math.cos(angle)*reach,ty=y+Math.sin(angle)*reach*.72;
 c.save();c.lineCap='round';c.strokeStyle='#263039';c.lineWidth=11;c.beginPath();c.moveTo(x,y);c.lineTo(tx,ty);c.stroke();
 c.strokeStyle='#e2e9ed';c.lineWidth=6;c.beginPath();c.moveTo(x,y);c.lineTo(tx,ty);c.stroke();c.restore();
}
// Eight-direction touch D-pad, compatible with portrait and landscape. Slide without lifting to turn.
const touchpad = document.getElementById('touchpad');
const thumb = touchpad.querySelector('.thumb');
let touchVector = {x:0,y:0}, activePointer = null;
function moveTouch(e) {
  const rect = touchpad.getBoundingClientRect();
  const x = e.clientX-(rect.left+rect.width/2), y=e.clientY-(rect.top+rect.height/2);
  const radius = Math.min(rect.width,rect.height)*0.38;
  const dist = Math.hypot(x,y);
  if(dist<13){touchVector={x:0,y:0};thumb.style.translate='0 0';return;}
  const angle = Math.atan2(y,x), octant = Math.round(angle/(Math.PI/4));
  touchVector={x:Math.round(Math.cos(octant*Math.PI/4)),y:Math.round(Math.sin(octant*Math.PI/4))};
  const scale = Math.min(dist,radius)/Math.max(dist,1);
  thumb.style.translate=(x*scale*0.55)+'px '+(y*scale*0.55)+'px';
}
function stopTouch(){activePointer=null;touchVector={x:0,y:0};thumb.style.translate='0 0';}
touchpad.addEventListener('pointerdown',e=>{if(activePointer!==null)return;activePointer=e.pointerId;touchpad.setPointerCapture(e.pointerId);moveTouch(e);e.preventDefault();});
touchpad.addEventListener('pointermove',e=>{if(e.pointerId===activePointer){moveTouch(e);e.preventDefault();}});
for(const eventName of ['pointerup','pointercancel','lostpointercapture']) touchpad.addEventListener(eventName,e=>{if(e.pointerId===activePointer)stopTouch();});
addEventListener('blur',stopTouch);


// The actor: feet at (x, y), body radius r. draw() is called at the right depth by drawMap.
const directions=['east','south-east','south','south-west','west','north-west','north','north-east'];
const sprites={idle:{},walk:{},run:{}};
const loadImage=(src)=>{const img=new Image();img.src=src;return img;};
for(const d of directions){
 sprites.idle[d]=[loadImage(`../../sprites/hero/idle/${d}/000.png`)];
 for(const a of ['walk','run']){
  sprites[a][d]=Array.from({length:a==='walk'?7:8},(_,i)=>loadImage(`../../sprites/hero/${a}/${d}/${String(i).padStart(3,'0')}.png`));
 }
}
const smithFrames=Array.from({length:16},(_,i)=>loadImage(`../../sprites/blacksmith/${String(i).padStart(3,'0')}.png`));
const hero={x:627,y:627,r:8,face:Math.PI/2,speed:190,moving:false,animTime:0,
 draw(c){
  const index=Math.round(this.face/(Math.PI/4));
  const dir=directions[((index%8)+8)%8];
  const frames=sprites[this.moving?'walk':'idle'][dir];
  const sprite=frames[this.moving?Math.floor(this.animTime*9)%frames.length:0];
  if(sprite?.complete&&sprite.naturalWidth){
   c.save();c.imageSmoothingEnabled=false;
   // Walk frames have more transparent padding than idle frames. Normalize their visible scale.
   // Walking: 70 -> 105 px (50% larger); idle: 70 -> 84 px to avoid an apparent size jump.
   const size=this.moving?105:84;
   c.drawImage(sprite,this.x-size/2,this.y+3-size,size,size);
   c.restore();
   drawSword(c,this);
  }
 }};
let smith=null;
function createSmith(x,y){return {x,y,draw(c){const im=smithFrames[Math.floor(performance.now()/130)%smithFrames.length];if(im?.complete&&im.naturalWidth){c.save();c.imageSmoothingEnabled=false;c.drawImage(im,this.x-58,this.y-87,116,116);c.restore();}}};}

(async () => {
  hud.textContent='Loading world definition…';
  const worldTimeout=setTimeout(()=>{hud.textContent='World loading is taking too long. Check network or refresh.\\n'+new URL(WORLD,location.href).href;},12000);
  const world = await kit.loadWorld(WORLD, KIT);
  clearTimeout(worldTimeout);
  hud.textContent='Loading first forest section…';
  let cell = Object.keys(world.data.cells)[0], map = await world.cell(cell);
  // Warm all neighboring maps without blocking play. world.cell caches in-flight and completed loads.
  function preloadNeighbors(fromCell) {
    const neighbors = Object.values(world.data.cells[fromCell]?.neighbours || {}).filter(Boolean);
    for (const next of neighbors) world.cell(next).catch(err => console.warn('Neighbor preload failed:', next, err));
  }
  // Avoid concurrent map decoding on memory-constrained mobile devices.
  if(!matchMedia('(pointer:coarse)').matches) preloadNeighbors(cell);
  [hero.x, hero.y] = kit.freeNear(map, map.size / 2, map.size / 2, hero.r);
  smith=createSmith(Math.min(map.size-130,hero.x+150),Math.min(map.size-130,hero.y+80));
  let last = performance.now(), busy = false;
  async function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    attackTime=Math.max(0,attackTime-dt);attackCooldown=Math.max(0,attackCooldown-dt);
    let dx = 0, dy = 0;
    if (keys.has('ArrowLeft') || keys.has('a')) dx--; if (keys.has('ArrowRight') || keys.has('d')) dx++;
    if (keys.has('ArrowUp') || keys.has('w')) dy--; if (keys.has('ArrowDown') || keys.has('s')) dy++;
    dx += touchVector.x; dy += touchVector.y;
    dx=Math.max(-1,Math.min(1,dx)); dy=Math.max(-1,Math.min(1,dy));
    hero.moving=!!(dx||dy);
    if(hero.moving)hero.animTime+=dt;else hero.animTime=0;
    if ((dx || dy) && !busy) {
      const len = Math.hypot(dx, dy);
      hero.face = Math.atan2(dy, dx);
      const stepX=dx / len * hero.speed * dt,stepY=dy / len * hero.speed * dt;
      // Short movement increments reduce catching on corners at low frame rates.
      const count=Math.max(1,Math.ceil(Math.hypot(stepX,stepY)/3));
      for(let i=0;i<count;i++)kit.move(map,hero,stepX/count,stepY/count);
      const t = await (busy = true, kit.travel(world, cell, hero)); busy = false;     // crossed an edge? then we are in the neighbour map now
      if (t) { cell = t.cell; map = t.map; if(!matchMedia('(pointer:coarse)').matches) preloadNeighbors(cell); }
    }
    // camera: the hero in the middle, clamped to the map
    const viewportWidth = document.documentElement.clientWidth || innerWidth;
    const viewportHeight = document.documentElement.clientHeight || innerHeight;
    const targetWidth = Math.ceil(viewportWidth / ZOOM), targetHeight = Math.ceil(viewportHeight / ZOOM);
    if(view.width!==targetWidth || view.height!==targetHeight){view.width=targetWidth;view.height=targetHeight;}
    const cam = { x: Math.max(0, Math.min(map.size - view.width, hero.x - view.width / 2)), y: Math.max(0, Math.min(map.size - view.height, hero.y - view.height / 2)) };
    if (view.width >= map.size) cam.x = (map.size - view.width) / 2;
    if (view.height >= map.size) cam.y = (map.size - view.height) / 2;
    ctx.fillStyle = '#0d0e11'; ctx.fillRect(0, 0, view.width, view.height);
    kit.drawMap(ctx, map, cam, cell===Object.keys(world.data.cells)[0]?[hero,smith]:[hero]);
    if (showCol) kit.drawCollision(ctx, map, cam);
    hud.textContent = `LINK'S ADVENTURE | FOREST PROTOTYPE
cell ${cell}  (${Math.round(hero.x)}, ${Math.round(hero.y)})
Move: WASD / arrows / D-pad   |   Sword: Space / J / touch
Walk through map edges to explore 4 connected forest sections`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})().catch(e => { hud.textContent = 'Could not start: ' + e.message + '\\nRun START_WINDOWS.bat (or serve this folder over HTTP).'; console.error(e); });
</script>
</body>
</html>
